<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wochenkorb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Titillium+Web:wght@400;600;700;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#050A0F; --plane:#081018; --surface:#0A141C; --surface-2:#10232D;
  --ink:#E8FCFF; --ink-2:#79A9B5; --muted:#5C8791; --line:#0E6070; --line-strong:#1C8FA8;
  --accent:#00E5FF; --accent-ink:#00161B; --accent-soft:rgba(0,229,255,.12); --accent-strong:#7DF9FF;
  --accent2:#147BFF; --accent2-soft:rgba(20,123,255,.14); --accent2-ink:#ffffff;
  --good:#22E6A0; --warn:#FFC145; --critical:#FF3B5C; --critical-soft:rgba(255,59,92,.14); --good-soft:rgba(34,230,160,.14);
  --topbar-bg:rgba(5,10,15,.85);
  --glow-sm: 0 0 10px rgba(0,229,255,.2);
  --glow-md: 0 0 26px rgba(0,229,255,.18), 0 10px 28px rgba(0,0,0,.55);
  --shadow: var(--glow-md);
  --text-glow: 0 0 10px rgba(0,229,255,.45);
  --chart-glow: drop-shadow(0 0 6px rgba(0,229,255,.4));
  --radius-card:6px; --radius-ctl:4px; --radius-pill:4px;
  --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70; --cat-4:#c98500;
  --cat-5:#d55181; --cat-6:#2fae2f; --cat-7:#9085e9; --cat-8:#e66767;
  --font-display:"Orbitron","Segoe UI",sans-serif;
  --font-ui:"Titillium Web","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    color-scheme: light;
    --bg:#EAF7FA; --plane:#DBF1F6; --surface:#FFFFFF; --surface-2:#DBF1F6;
    --ink:#04222B; --ink-2:#2C5C68; --muted:#6C97A1; --line:#8FD3E0; --line-strong:#3FB6CC;
    --accent:#0092A8; --accent-ink:#FFFFFF; --accent-soft:rgba(0,146,168,.10); --accent-strong:#00C2D9;
    --accent2:#0B63D6; --accent2-soft:rgba(11,99,214,.10); --accent2-ink:#ffffff;
    --good:#0A8F6B; --warn:#B57500; --critical:#D6274B; --critical-soft:rgba(214,39,75,.12); --good-soft:rgba(10,143,107,.12);
    --topbar-bg:rgba(234,247,250,.88);
    --glow-sm: 0 0 8px rgba(0,146,168,.12);
    --glow-md: 0 4px 20px rgba(4,34,43,.12);
    --shadow: var(--glow-md);
    --text-glow: none;
    --chart-glow: none;
    --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
    --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
  }
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#EAF7FA; --plane:#DBF1F6; --surface:#FFFFFF; --surface-2:#DBF1F6;
  --ink:#04222B; --ink-2:#2C5C68; --muted:#6C97A1; --line:#8FD3E0; --line-strong:#3FB6CC;
  --accent:#0092A8; --accent-ink:#FFFFFF; --accent-soft:rgba(0,146,168,.10); --accent-strong:#00C2D9;
  --accent2:#0B63D6; --accent2-soft:rgba(11,99,214,.10); --accent2-ink:#ffffff;
  --good:#0A8F6B; --warn:#B57500; --critical:#D6274B; --critical-soft:rgba(214,39,75,.12); --good-soft:rgba(10,143,107,.12);
  --topbar-bg:rgba(234,247,250,.88);
  --glow-sm: 0 0 8px rgba(0,146,168,.12);
  --glow-md: 0 4px 20px rgba(4,34,43,.12);
  --shadow: var(--glow-md);
  --text-glow: none;
  --chart-glow: none;
  --cat-1:#2a78d6; --cat-2:#eb6834; --cat-3:#1baf7a; --cat-4:#eda100;
  --cat-5:#e87ba4; --cat-6:#008300; --cat-7:#4a3aa7; --cat-8:#e34948;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; position:relative;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:40px 40px; opacity:.05;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:.01em}
p{margin:0}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer}
a{color:inherit}
.tabular{font-variant-numeric:tabular-nums}
::selection{background:var(--accent-soft); color:var(--ink)}
::-webkit-scrollbar{width:10px; height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
@media (prefers-reduced-motion:no-preference){
  .anim{transition:transform .16s ease, opacity .16s ease, background-color .16s ease, border-color .16s ease}
  button,.chip-btn,.icon-btn,.navitem,a{transition:box-shadow .15s ease, border-color .15s ease, background-color .15s ease, color .15s ease, transform .1s ease}
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}

/* ---------- App shell ---------- */
#app{min-height:100vh; display:flex; flex-direction:column; position:relative; z-index:1}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--topbar-bg); backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; padding:16px 20px;
}
.topbar .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:.05em; text-transform:uppercase}
.topbar .brand .mark{font-size:20px; filter:drop-shadow(0 0 8px rgba(0,229,255,.5))}
.topbar .spacer{flex:1}
.icon-btn{
  width:40px; height:40px; border-radius:var(--radius-ctl); border:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--ink-2);
}
.icon-btn:hover{border-color:var(--accent); color:var(--accent); box-shadow:var(--glow-sm)}
.icon-btn:active{transform:scale(.94)}
main{flex:1; width:100%; max-width:760px; margin:0 auto; padding:20px 16px 100px; display:block; position:relative; z-index:1}

/* Bottom nav (mobile) */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line);
  display:flex; align-items:stretch; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px rgba(0,0,0,.4);
}
.navitem{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  border:none; background:none; padding:6px 2px; border-radius:var(--radius-ctl); color:var(--muted); font-size:10px; font-weight:700;
  text-transform:uppercase; letter-spacing:.03em;
}
.navitem .ic{font-size:19px}
.navitem.active{color:var(--accent); text-shadow:var(--text-glow)}
.navitem.scan{color:var(--accent)}
.navitem.scan .ic-wrap{
  width:46px; height:46px; border-radius:50%; background:radial-gradient(circle at 32% 28%, var(--accent-strong), var(--accent2) 75%);
  color:#00161B; display:flex; align-items:center; justify-content:center;
  margin-top:-24px; box-shadow:0 0 22px rgba(0,229,255,.55), 0 6px 16px rgba(0,0,0,.5); font-size:19px;
  border:2px solid var(--bg);
}

/* Desktop sidebar */
.sidebar{display:none}
@media (min-width:900px){
  #app{flex-direction:row}
  .bottomnav{display:none}
  .topbar{display:none}
  .sidebar{
    display:flex; flex-direction:column; width:240px; flex-shrink:0; border-right:1px solid var(--line);
    padding:24px 16px; gap:4px; height:100vh; position:sticky; top:0; background:var(--surface-2); z-index:1;
  }
  .sidebar .brand{font-family:var(--font-display); font-weight:700; font-size:17px; padding:6px 10px 22px; display:flex; align-items:center; gap:10px; letter-spacing:.05em; text-transform:uppercase}
  .sidebar .brand .mark{filter:drop-shadow(0 0 8px rgba(0,229,255,.5))}
  .sidebar a.navitem{
    flex-direction:row; justify-content:flex-start; gap:12px; padding:11px 14px; font-size:13px; border-radius:var(--radius-ctl);
    border-left:2px solid transparent; text-transform:none; letter-spacing:.01em; font-weight:600;
  }
  .sidebar a.navitem.active{background:var(--accent-soft); color:var(--accent); border-left-color:var(--accent); text-shadow:none}
  .sidebar a.navitem .ic{font-size:16px; width:20px; text-align:center}
  .sidebar .navitem.scan .ic-wrap{display:none}
  .sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:4px}
  main{max-width:900px; padding:32px 40px 60px}
  #app > main{margin:0; flex:1}
}

/* ---------- Components ---------- */
.card{
  position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:20px;
  box-shadow:var(--shadow);
}
.card::before,.card::after{ content:""; position:absolute; width:10px; height:10px; pointer-events:none; opacity:.8 }
.card::before{ top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent) }
.card::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent) }
.card + .card{margin-top:16px}
.stack{display:flex; flex-direction:column; gap:16px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (min-width:640px){ .grid2-desk3{grid-template-columns:repeat(3,1fr)} }
.row{display:flex; align-items:center; gap:10px}
.between{justify-content:space-between}
.section-title{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-2); margin-bottom:8px}
.hairline{border:none; border-top:1px solid var(--line); margin:16px 0}

.btn{
  border-radius:var(--radius-ctl); padding:12px 20px; font-weight:700; font-size:12.5px; border:1px solid transparent;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px;
  text-transform:uppercase; letter-spacing:.04em; font-family:var(--font-ui);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:none; box-shadow:0 0 0 3px var(--bg), 0 0 0 5px var(--accent)}
.btn-primary{background:var(--accent); color:var(--accent-ink); box-shadow:var(--glow-sm)}
.btn-primary:hover{box-shadow:0 0 20px rgba(0,229,255,.4)}
.btn-accent2{background:var(--accent2); color:var(--accent2-ink); box-shadow:0 0 16px rgba(20,123,255,.4)}
.btn-outline{background:transparent; border-color:var(--line-strong); color:var(--accent)}
.btn-outline:hover{box-shadow:var(--glow-sm); border-color:var(--accent)}
.btn-ghost{background:transparent; color:var(--ink-2); padding:10px 12px; clip-path:none; text-transform:none; letter-spacing:0; font-weight:600}
.btn-ghost:hover{color:var(--accent)}
.btn-danger{background:transparent; border-color:var(--critical); color:var(--critical)}
.btn-danger:hover{box-shadow:0 0 14px rgba(255,59,92,.3)}
.btn-block{width:100%}
.btn-sm{padding:8px 14px; font-size:11px; min-height:36px}
.fab-scan{
  display:flex; align-items:center; gap:10px; justify-content:center; width:100%; padding:16px; border-radius:var(--radius-ctl);
  background:linear-gradient(135deg, var(--accent2), #0B5FCC); color:#fff; font-weight:700; font-size:13px;
  box-shadow:0 0 26px rgba(20,123,255,.4), 0 6px 20px rgba(0,0,0,.4); border:1px solid rgba(125,249,255,.35);
  text-transform:uppercase; letter-spacing:.05em;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],input[type=email],select,textarea{
  width:100%; padding:12px 14px; border-radius:var(--radius-ctl); border:1px solid var(--line); background:var(--plane);
  color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical; min-height:64px}
label.field{display:flex; flex-direction:column; gap:6px; font-size:11px; font-weight:700; color:var(--ink-2); text-transform:uppercase; letter-spacing:.05em}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px}
select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%); background-position:calc(100% - 18px) center, calc(100% - 13px) center; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px}

.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--radius-ctl); background:var(--plane);
  font-size:12px; font-weight:600; color:var(--ink-2); border:1px solid var(--line); white-space:nowrap; letter-spacing:.01em;
}
.chip .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0}
.chip-btn{border:1px solid var(--line-strong); background:var(--plane); color:var(--ink-2)}
.chip-btn.active{background:var(--accent-soft); color:var(--accent); border-color:var(--accent); box-shadow:var(--glow-sm)}
.chiprow{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; -ms-overflow-style:none; scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}

.progress{height:8px; border-radius:2px; background:var(--plane); overflow:hidden; border:1px solid var(--line)}
.progress > div{height:100%; background:linear-gradient(90deg, var(--accent2), var(--accent)); box-shadow:0 0 10px rgba(0,229,255,.5)}
@media (prefers-reduced-motion:no-preference){ .progress > div{transition:width .3s ease} }

.stat-tile{position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:14px 16px; box-shadow:var(--shadow)}
.stat-tile .val{font-family:var(--font-display); font-size:21px; font-weight:700; color:var(--accent-strong); text-shadow:var(--text-glow)}
.stat-tile .lbl{font-size:10.5px; color:var(--ink-2); font-weight:700; margin-top:5px; text-transform:uppercase; letter-spacing:.05em}

.listitem{display:flex; align-items:flex-start; gap:12px; padding:14px 4px; border-bottom:1px solid var(--line)}
.listitem:last-child{border-bottom:none}
.check{
  width:24px; height:24px; border-radius:2px; border:1.5px solid var(--line-strong); flex-shrink:0; margin-top:1px;
  display:flex; align-items:center; justify-content:center; background:var(--plane); font-size:14px; color:transparent;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
}
.check.checked{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); box-shadow:var(--glow-sm)}
.li-main{flex:1; min-width:0}
.li-title{font-weight:700; font-size:14.5px}
.li-title.done{text-decoration:line-through; color:var(--muted); font-weight:600}
.li-meta{font-size:12px; color:var(--ink-2); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.li-actions{display:flex; gap:4px; flex-shrink:0}
.iconbtn-sm{width:32px; height:32px; border-radius:var(--radius-ctl); border:none; background:transparent; color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:15px}
.iconbtn-sm:hover{color:var(--accent); background:var(--accent-soft)}
.iconbtn-sm:active{background:var(--plane)}

.cat-icon{width:34px; height:34px; border-radius:var(--radius-ctl); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; border:1px solid var(--line)}

.empty{text-align:center; padding:48px 20px; color:var(--ink-2)}
.empty .emoji{font-size:38px; margin-bottom:12px; display:block; filter:drop-shadow(0 0 10px rgba(0,229,255,.25))}
.empty .t1{font-weight:700; color:var(--ink); font-size:15px; margin-bottom:6px; font-family:var(--font-display); letter-spacing:.02em}

.modal-backdrop{position:fixed; inset:0; background:rgba(2,6,10,.78); backdrop-filter:blur(3px); z-index:100; display:flex; align-items:flex-end; justify-content:center}
@media (min-width:640px){ .modal-backdrop{align-items:center} }
.modal{
  position:relative; background:var(--surface); width:100%; max-width:520px; max-height:92vh; overflow-y:auto; border:1px solid var(--line-strong); border-radius:6px 6px 0 0;
  padding:22px; box-shadow:0 0 44px rgba(0,229,255,.16), 0 24px 60px rgba(0,0,0,.6);
}
@media (min-width:640px){ .modal{border-radius:6px} }
.modal::before,.modal::after{ content:""; position:absolute; width:14px; height:14px; pointer-events:none }
.modal::before{ top:-1px; left:-1px; border-top:2px solid var(--accent); border-left:2px solid var(--accent) }
.modal::after{ bottom:-1px; right:-1px; border-bottom:2px solid var(--accent); border-right:2px solid var(--accent) }
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px}
.modal-head h3{font-size:17px; text-transform:uppercase; letter-spacing:.03em}

.toastwrap{position:fixed; left:0; right:0; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:200; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
@media (min-width:900px){ .toastwrap{bottom:24px} }
.toast{background:var(--surface); color:var(--ink); border:1px solid var(--accent); padding:12px 20px; border-radius:3px; font-size:13px; font-weight:600; box-shadow:0 0 22px rgba(0,229,255,.28), 0 8px 20px rgba(0,0,0,.4); max-width:90vw; letter-spacing:.01em}
.toast-warn{border-color:var(--critical); box-shadow:0 0 22px rgba(255,59,92,.28), 0 8px 20px rgba(0,0,0,.4); color:var(--critical)}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:2px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; border:1px solid transparent}
.badge-demo{background:var(--accent2-soft); color:var(--accent2); border-color:var(--accent2)}
.badge-good{background:var(--good-soft); color:var(--good); border-color:var(--good)}
.badge-critical{background:var(--critical-soft); color:var(--critical); border-color:var(--critical)}

.tablewrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px}
th{text-align:left; color:var(--ink-2); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; padding:10px 8px; border-bottom:1px solid var(--line-strong)}
td{padding:10px 8px; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}

.barrow{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.barrow:last-child{margin-bottom:0}
.barrow .lbl{width:112px; flex-shrink:0; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.barrow .track{flex:1; height:14px; background:var(--plane); border-radius:2px; overflow:hidden; position:relative; border:1px solid var(--line)}
.barrow .fill{height:100%}
.barrow .val{width:64px; text-align:right; font-size:12px; font-weight:700; flex-shrink:0}

.hero-num{font-family:var(--font-display); font-size:30px; font-weight:700; letter-spacing:.01em; color:var(--accent-strong); text-shadow:var(--text-glow)}
.link{color:var(--accent); font-weight:700; font-size:13px; text-decoration:none}
.link:hover{text-shadow:var(--text-glow)}

.searchbox{position:relative}
.suggest{position:absolute; left:0; right:0; top:calc(100% + 8px); background:var(--surface); border:1px solid var(--line-strong); border-radius:4px; box-shadow:0 0 26px rgba(0,229,255,.16), 0 14px 34px rgba(0,0,0,.5); z-index:50; overflow:hidden; max-height:300px; overflow-y:auto}
.suggest-item{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line)}
.suggest-item:last-child{border-bottom:none}
.suggest-item:active{background:var(--accent-soft)}

.skeleton-bar{height:120px; border-radius:4px; background:linear-gradient(90deg,var(--plane),var(--surface-2),var(--plane)); background-size:200% 100%; border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){ .skeleton-bar{animation:shimmer 1.3s ease infinite} }
@keyframes shimmer{ 0%{background-position:200% 0} 100%{background-position:-200% 0} }

.svg-tip{position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--accent); color:var(--ink); font-size:11px; font-weight:700; padding:6px 10px; border-radius:3px; transform:translate(-50%,-120%); white-space:nowrap; z-index:5; box-shadow:0 0 12px rgba(0,229,255,.3)}
.chart-wrap{position:relative}
.chart-wrap svg{filter:var(--chart-glow)}
.receipt-photo{width:100%; max-height:220px; object-fit:cover; border-radius:4px; border:1px solid var(--line-strong)}

const clamp = (n,a,b) => Math.max(a, Math.min(b, n));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normName = (s) => String(s||"").toLowerCase().trim().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ");
const fmtEUR = (n) => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);
const fmtDate = (iso, opts) => { try{ return new Intl.DateTimeFormat('de-DE', opts||{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(iso)); }catch(e){ return ''; } };
const fmtDateLong = (iso) => fmtDate(iso, {day:'2-digit', month:'long', year:'numeric'});
const daysBetween = (a,b) => Math.round((new Date(b) - new Date(a)) / 86400000);
function startOfWeek(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setHours(0,0,0,0); dt.setDate(dt.getDate()-day); return dt; }
function endOfWeek(d){ const s=startOfWeek(d); const e=new Date(s); e.setDate(s.getDate()+6); e.setHours(23,59,59,999); return e; }
function startOfMonth(d){ const dt=new Date(d); return new Date(dt.getFullYear(), dt.getMonth(), 1); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function escAttr(s){ return esc(s).replace(/\n/g,' '); }

/* ============================= Store / persistence ============================= */
const STORAGE_KEY = 'wochenkorb.store.v1';
let storageOK = true;
let store = null;

function freshStore(){
  return {
    version:1,
    categories: [],
    products: [],
    shoppingList: [],
    shoppings: [],
    priceHistory: [],
    markets: [],
    categoryCorrections: {},
    settings: { theme:'system', firstRunDone:false, demoActive:false, recurringTemplate:[] },
  };
}
function seedDefaults(s){
  if(s.categories.length===0){
    s.categories = DEFAULT_CATEGORIES.map(c => ({id:'cat_'+c.key, name:c.name, icon:c.icon, isDefault:true, createdAt:nowIso()}));
  }
  if(s.markets.length===0){
    s.markets = DEFAULT_MARKETS.map(m => ({id:'mkt_'+normName(m).replace(/\s+/g,'-'), name:m, isDefault:true}));
  }
}
function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ store = JSON.parse(raw); }
    else { store = freshStore(); }
  }catch(e){ storageOK=false; store = freshStore(); }
  seedDefaults(store);
  if(!store.settings) store.settings = { theme:'system', firstRunDone:false, demoActive:false, recurringTemplate:[] };
  if(!store.categoryCorrections) store.categoryCorrections = {};
  if(!Array.isArray(store.priceHistory)) store.priceHistory = [];
}
function saveStore(){
  if(!storageOK) return;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
  catch(e){ storageOK=false; toast('Lokaler Speicher nicht verfügbar – Änderungen werden evtl. nicht gespeichert.', true); }
}
function catById(id){ return store.categories.find(c=>c.id===id); }
function catByName(name){ return store.categories.find(c=>normName(c.name)===normName(name)); }
function sonstigeId(){ return (store.categories.find(c=>c.key==='sonstiges') || catByName('Sonstiges') || store.categories.find(c=>/sonstig/i.test(c.name)) || store.categories[store.categories.length-1]).id; }
function prodById(id){ return store.products.find(p=>p.id===id); }
function marketById(id){ return store.markets.find(m=>m.id===id); }

function classifyProduct(name){
  const n = normName(name);
  if(store.categoryCorrections[n]) return store.categoryCorrections[n];
  for(const [key, words] of Object.entries(CATEGORY_KEYWORDS)){
    if(words.some(w => n.includes(w))){
      const c = store.categories.find(c=>c.id==='cat_'+key) || store.categories.find(c=>normName(c.name).includes(key));
      if(c) return c.id;
    }
  }
  return sonstigeId();
}
function rememberCorrection(name, categoryId){ store.categoryCorrections[normName(name)] = categoryId; }

function findOrCreateProduct(name, categoryId, unit, price){
  let p = store.products.find(p => normName(p.name)===normName(name));
  if(p) return p;
  p = {
    id: uid(), name: name.trim(), categoryId: categoryId || classifyProduct(name), barcode:null,
    defaultQuantity:1, defaultUnit: unit || 'Stück', defaultPrice: price ?? null, favorite:false, note:'',
    createdAt: nowIso(), updatedAt: nowIso(), lastPurchasedAt:null, purchaseCount:0, isDemo:false,
  };
  store.products.push(p);
  return p;
}

/* ============================= Demo data ============================= */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function seedDemoData(){
  const products = DEMO_PRODUCT_POOL.map(([name,catKey,unit,qty,price]) => ({
    id:'dp_'+uid(), name, categoryId:'cat_'+catKey, barcode:null, defaultQuantity:qty, defaultUnit:unit,
    defaultPrice:price, favorite: Math.random()<0.18, note:'', createdAt:nowIso(), updatedAt:nowIso(),
    lastPurchasedAt:null, purchaseCount:0, isDemo:true,
  }));
  store.products.push(...products);

  const today = new Date();
  const numShoppings = 7;
  for(let w=numShoppings; w>=1; w--){
    const d = new Date(today); d.setDate(d.getDate() - w*6 - Math.floor(Math.random()*2));
    const market = store.markets[Math.floor(Math.random()*(store.markets.length-1))];
    const itemCount = 6 + Math.floor(Math.random()*7);
    const chosen = [...products].sort(()=>Math.random()-0.5).slice(0, itemCount);
    let total = 0;
    const items = chosen.map(p => {
      const jitter = 1 + (Math.random()*0.16 - 0.08);
      const price = Math.max(0.29, Math.round(p.defaultPrice * jitter * 100)/100);
      const qty = p.defaultQuantity;
      total += price;
      return { id: uid(), productId:p.id, name:p.name, quantity:qty, unit:p.defaultUnit, price, categoryId:p.categoryId };
    });
    const shopping = {
      id:'ds_'+uid(), market: market.name, date: d.toISOString(), total: Math.round(total*100)/100,
      receiptImage:null, items, source:'demo', isDemo:true, createdAt: d.toISOString(),
    };
    store.shoppings.push(shopping);
    items.forEach(it => {
      const prod = prodById(it.productId);
      if(prod){ prod.purchaseCount++; if(!prod.lastPurchasedAt || d > new Date(prod.lastPurchasedAt)) prod.lastPurchasedAt = d.toISOString(); }
      store.priceHistory.push({ id:uid(), productId: it.productId, shoppingId: shopping.id, price: it.price, date: d.toISOString(), market: market.name });
    });
  }
  store.shoppings.sort((a,b)=> new Date(b.date) - new Date(a.date));

  const openPicks = [...products].sort(()=>Math.random()-0.5).slice(0,5);
  store.shoppingList = openPicks.map((p,i)=>({
    id:uid(), productId:p.id, name:p.name, quantity:p.defaultQuantity, unit:p.defaultUnit, categoryId:p.categoryId,
    estimatedPrice:p.defaultPrice, checked:false, note:'', order:i, createdAt:nowIso(), purchasedAt:null,
  }));
  store.settings.demoActive = true;
}
function removeDemoData(){
  store.products = store.products.filter(p=>!p.isDemo);
  store.shoppings = store.shoppings.filter(s=>!s.isDemo);
  store.shoppingList = store.shoppingList.filter(i=>{
    const p = prodById(i.productId); return !(p && p.isDemo) ;
  });
  store.priceHistory = store.priceHistory.filter(ph => prodById(ph.productId));
  store.settings.demoActive = false;
  saveStore(); render();
  toast('Demo-Daten entfernt.');
}

/* ============================= Toast & Modal ============================= */
function toast(msg, isWarn){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (isWarn ? ' toast-warn' : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(), 250); }, 2600);
}
function openModal(html){
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="modal-backdrop" id="modal-backdrop" onmousedown="if(event.target.id==='modal-backdrop')App.closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; }

const ROUTES = [
  {key:'dashboard', path:'', label:'Übersicht', icon:'🏠'},
  {key:'liste', path:'liste', label:'Liste', icon:'📝'},
  {key:'scan', path:'scan', label:'Scannen', icon:'📷'},

  {key:'statistik', path:'statistik', label:'Statistik', icon:'📊'},
];
const MORE_ROUTES = [
  {key:'produkte', path:'produkte', label:'Produkte', icon:'🛒'},
  {key:'kategorien', path:'kategorien', label:'Kategorien', icon:'🏷️'},
  {key:'maerkte', path:'maerkte', label:'Märkte', icon:'🏬'},

  {key:'einstellungen', path:'einstellungen', label:'Einstellungen', icon:'⚙️'},
];
function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, '');
  const [path, param] = hash.split('/');
  return { path: path||'', param };
}
function renderNav(){
  const {path} = currentRoute();
  const bottom = document.getElementById('bottomnav');
  bottom.innerHTML = ROUTES.map(r => {
    if(r.key==='scan'){
      return `<button class="navitem scan" onclick="App.nav('${r.path}')"><span class="ic-wrap"><span class="ic">${r.icon}</span></span><span>${r.label}</span></button>`;
    }
    return `<button class="navitem ${path===r.path?'active':''}" onclick="App.nav('${r.path}')"><span class="ic">${r.icon}</span><span>${r.label}</span></button>`;
  }).join('');

  const side = document.getElementById('sidebar');
  const all = [...ROUTES, ...MORE_ROUTES];
  side.innerHTML = `<div class="brand"><span>🧺</span> Wochenkorb</div>` +
    all.map(r => `<a class="navitem ${path===r.path?'active':''}" href="#/${r.path}"><span class="ic">${r.icon}</span><span>${r.label}</span></a>`).join('') ;
}

function render(){
  renderNav();
  const {path, param} = currentRoute();
  const view = document.getElementById('view');
  let html = '';
  try{
    switch(path){
      case '': html = viewDashboard(); break;
      case 'liste': html = viewListe(); break;
      case 'scan': html = viewScan(); break;
      case 'verlauf': html = param ? viewVerlaufDetail(param) : viewVerlauf(); break;
      case 'statistik': html = viewStatistik(); break;
      case 'produkte': html = param ? viewProduktDetail(param) : viewProdukte(); break;
      case 'kategorien': html = viewKategorien(); break;
      case 'maerkte': html = viewMaerkte(); break;
      case 'suche': html = viewSuche(); break;
      case 'einstellungen': html = viewEinstellungen(); break;
      default: html = viewDashboard();
    }
  }catch(err){
    console.error(err);
    html = `<div class="card"><div class="empty"><span class="emoji">⚠️</span><div class="t1">Etwas ist schiefgelaufen</div><p>${esc(err.message)}</p></div></div>`;
  }
  view.innerHTML = html;
  window.scrollTo(0,0);
  afterRender(path);
}
function afterRender(path){
  if(path==='statistik') requestAnimationFrame(drawStatistikCharts);
  if(path==='dashboard' || path==='') requestAnimationFrame(drawDashboardMiniChart);
  if(path==='produkte' && currentRoute().param) requestAnimationFrame(drawProductSparkline);
}

/* ============================= Derived data helpers ============================= */
function shoppingsInRange(fromDate, toDate){
  return store.shoppings.filter(s => { const d=new Date(s.date); return d>=fromDate && d<=toDate; });
}
function totalOfShopping(s){ return s.items.reduce((a,i)=>a+ (i.price||0), 0); }
function weekLabel(d){ return fmtDate(d, {day:'2-digit',month:'2-digit'}); }

function rangeForFilter(filterKey, customFrom, customTo){
  const now = new Date();
  let from = new Date(now); let to = new Date(now); to.setHours(23,59,59,999);
  switch(filterKey){
    case '7d': from.setDate(now.getDate()-6); break;
    case '4w': from.setDate(now.getDate()-27); break;
    case '1m': from.setMonth(now.getMonth()-1); break;
    case '3m': from.setMonth(now.getMonth()-3); break;
    case '1y': from.setFullYear(now.getFullYear()-1); break;
    case 'custom': from = customFrom? new Date(customFrom): new Date(now.setMonth(now.getMonth()-1)); to = customTo? new Date(customTo): to; to.setHours(23,59,59,999); break;
    default: from.setMonth(now.getMonth()-1);
  }
  from.setHours(0,0,0,0);
  return {from, to};
}
function avgPurchaseIntervalDays(productId){
  const dates = store.priceHistory.filter(p=>p.productId===productId).map(p=>new Date(p.date)).sort((a,b)=>a-b);
  if(dates.length<2) return null;
  let diffs=[]; for(let i=1;i<dates.length;i++) diffs.push(daysBetween(dates[i-1],dates[i]));
  return diffs.reduce((a,b)=>a+b,0)/diffs.length;
}
function avgPrice(productId){
  const arr = store.priceHistory.filter(p=>p.productId===productId);
  if(!arr.length) return null;
  return arr.reduce((a,b)=>a+b.price,0)/arr.length;
}

function viewDashboard(){
  const now = new Date();
  const wStart = startOfWeek(now), wEnd = endOfWeek(now);
  const list = store.shoppingList.slice().sort((a,b)=>a.order-b.order);
  const open = list.filter(i=>!i.checked);
  const checked = list.filter(i=>i.checked);
  const weekShoppings = shoppingsInRange(wStart, wEnd);
  const weekSpend = weekShoppings.reduce((a,s)=>a+totalOfShopping(s),0);
  const listValue = list.reduce((a,i)=>a+(i.estimatedPrice||0)*(i.quantity||1)/(i.quantity||1)+ (i.estimatedPrice||0)*0,0);

let listAddQuery = '';
let listFilterTab = 'zuletzt';
let reorderMode = false;

function suggestProducts(query){
  const n = normName(query);
  if(!n) return [];
  const scored = store.products.map(p=>{
    const pn = normName(p.name);
    let score = -1;
    if(pn===n) score=100; else if(pn.startsWith(n)) score=80; else if(pn.includes(n)) score=50;
    if(score<0) return null;
    score += p.favorite?10:0; score += Math.min(p.purchaseCount,10);
    return {p, score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,6).map(x=>x.p);
  return scored;
}

function viewListe(){
  const list = store.shoppingList.slice().sort((a,b)=>a.order-b.order);
  const open = list.filter(i=>!i.checked);

  const suggestions = suggestProducts(listAddQuery);

  const recents = store.products.filter(p=>p.lastPurchasedAt).sort((a,b)=>new Date(b.lastPurchasedAt)-new Date(a.lastPurchasedAt)).slice(0,10);
  const favs = store.products.filter(p=>p.favorite).slice(0,10);
  const freq = store.products.filter(p=>p.purchaseCount>0).sort((a,b)=>b.purchaseCount-a.purchaseCount).slice(0,10);
  const chipSource = listFilterTab==='zuletzt'? recents : listFilterTab==='favoriten'? favs : freq;

  const recurring = store.products.filter(p=>{
    const avg = avgPurchaseIntervalDays(p.id);
    if(!avg || avg<4 || avg>10) return false;
    if(!p.lastPurchasedAt) return false;
    if(list.some(i=>i.productId===p.id)) return false;
    const sinceLast = daysBetween(new Date(p.lastPurchasedAt), new Date());
    return sinceLast >= avg - 2;
  }).slice(0,4);

  const grouped = {};
  open.forEach(i=>{ (grouped[i.categoryId] = grouped[i.categoryId]||[]).push(i); });
  const catIds = Object.keys(grouped).sort((a,b)=>{ const ca=catById(a),cb=catById(b); return (ca?ca.name:'').localeCompare(cb?cb.name:''); });

          ${listAddQuery.trim() && !store.products.some(p=>normName(p.name)===normName(listAddQuery)) ? `<div class="suggest-item" onclick="App.quickAddByName('${escAttr(listAddQuery)}')" style="color:var(--accent); font-weight:700">➕ „${esc(listAddQuery)}" neu anlegen</div>`:''}

let statFilter = '1m';
let statCustomFrom = null, statCustomTo = null;
let statSelectedProduct = null;

function viewStatistik(){
  const {from, to} = rangeForFilter(statFilter, statCustomFrom, statCustomTo);
  const shoppings = shoppingsInRange(from, to);
  const totalSpend = shoppings.reduce((a,s)=>a+totalOfShopping(s),0);
  const weeks = Math.max(1, (to-from)/(7*86400000));
  const months = Math.max(1, (to-from)/(30.4*86400000));

  const weekMap = {};

  const weekKeys = Object.keys(weekMap).map(Number).sort((a,b)=>a-b);
  const weekSeries = weekKeys.map(k=>({date:new Date(k), value:weekMap[k]}));

  const spendByCat = {}; const countByCat = {};
  shoppings.forEach(s=>s.items.forEach(it=>{ spendByCat[it.categoryId]=(spendByCat[it.categoryId]||0)+it.price; countByCat[it.categoryId]=(countByCat[it.categoryId]||0)+1; }));
  const spendEntries = Object.entries(spendByCat).sort((a,b)=>b[1]-a[1]);
  const countEntries = Object.entries(countByCat).sort((a,b)=>b[1]-a[1]);
  const spendTop = spendEntries.slice(0,7); const spendOtherSum = spendEntries.slice(7).reduce((a,[,v])=>a+v,0);
  const countTop = countEntries.slice(0,7); const countOtherSum = countEntries.slice(7).reduce((a,[,v])=>a+v,0);
  const spendTotal = spendEntries.reduce((a,[,v])=>a+v,0) || 1;
  const countTotal = countEntries.reduce((a,[,v])=>a+v,0) || 1;

  const purchasedProducts = store.products.filter(p=>p.purchaseCount>0).sort((a,b)=>a.name.localeCompare(b.name));
  const selProd = statSelectedProduct ? prodById(statSelectedProduct) : null;
  const priceSeries = selProd ? store.priceHistory.filter(p=>p.productId===selProd.id).sort((a,b)=>new Date(a.date)-new Date(b.date)) : [];
  let priceDeltaTxt = '';
  if(priceSeries.length>=2){
    const last = priceSeries[priceSeries.length-1], prev = priceSeries[priceSeries.length-2];
    const pct = ((last.price - prev.price)/prev.price*100);
    priceDeltaTxt = `<span class="badge ${pct>0?'badge-critical':'badge-good'}">${pct>0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}% ggü. letztem Einkauf</span>`;

    <div class="chiprow">
      ${[['7d','7 Tage'],['4w','4 Wochen'],['1m','1 Monat'],['3m','3 Monate'],['1y','1 Jahr'],['custom','Individuell']].map(([k,l])=>
        `<button class="chip chip-btn ${statFilter===k?'active':''}" onclick="App.setStatFilter('${k}')">${l}</button>`).join('')}

      <label class="field" style="flex:1">Von<input type="date" value="${statCustomFrom||''}" onchange="App.setStatCustom('from',this.value)"></label>
      <label class="field" style="flex:1">Bis<input type="date" value="${statCustomTo||''}" onchange="App.setStatCustom('to',this.value)"></label>
    </div>`:''}

    <div class="grid2 grid2-desk3">
      <div class="stat-tile"><div class="val tabular">${fmtEUR(totalSpend)}</div><div class="lbl">Gesamtausgaben</div></div>
      <div class="stat-tile"><div class="val tabular">${shoppings.length}</div><div class="lbl">Einkäufe</div></div>

      <div class="stat-tile"><div class="val tabular">${fmtEUR(avgPerWeek)}</div><div class="lbl">Ø pro Woche</div></div>

    </div>

    <div class="card">
      <h3 style="font-size:15px; margin-bottom:10px">Ausgaben pro Woche</h3>
      ${weekSeries.length<2 ? `<p style="font-size:12.5px;color:var(--muted)">Noch nicht genug Daten im gewählten Zeitraum.</p>` : `<div class="chart-wrap" id="linechart-wrap"></div>`}
    </div>

    <div class="card">

        spendTop.map(([cid,val])=>{ const c=catById(cid); return `<div class="barrow"><div class="lbl">${c?c.icon:'📦'} ${c?esc(c.name):'Sonstiges'}</div><div class="track"><div class="fill" style="width:${val/spendTotal*100}%; background:${catColorVar(cid)}"></div></div><div class="val tabular">${(val/spendTotal*100).toFixed(0)}%</div></div>`;}).join('')}
      ${spendOtherSum>0 ? `<div class="barrow"><div class="lbl">📦 Sonstige</div><div class="track"><div class="fill" style="width:${spendOtherSum/spendTotal*100}%; background:var(--muted)"></div></div><div class="val tabular">${(spendOtherSum/spendTotal*100).toFixed(0)}%</div></div>`:''}
    </div>

    <div class="card">

        countTop.map(([cid,val])=>{ const c=catById(cid); return `<div class="barrow"><div class="lbl">${c?c.icon:'📦'} ${c?esc(c.name):'Sonstiges'}</div><div class="track"><div class="fill" style="width:${val/countTotal*100}%; background:${catColorVar(cid)}"></div></div><div class="val tabular">${val}×</div></div>`;}).join('')}

}

function svgLine(container, series, opts){
  if(!container) return;
  const w = Math.max(280, container.clientWidth || 300), h = opts.h||180;
  const pad = {l:38,r:14,t:14,b:26};
  const xs = series.map((_,i)=>i);
  const ys = series.map(d=>d.value);
  const maxY = Math.max(...ys, 1) * 1.15;
  const minY = 0;
  const x = i => pad.l + (i/(Math.max(series.length-1,1))) * (w-pad.l-pad.r);
  const y = v => h-pad.b - ((v-minY)/(maxY-minY||1)) * (h-pad.t-pad.b);
  const pathD = series.map((d,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(d.value).toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${x(series.length-1).toFixed(1)},${(h-pad.b)} L${x(0).toFixed(1)},${(h-pad.b)} Z`;
  const gridLines = 4;
  let grid='';
  for(let i=0;i<=gridLines;i++){ const gy = pad.t + i*((h-pad.t-pad.b)/gridLines); const val = maxY - i*(maxY/gridLines);
    grid += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${pad.l-6}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtEUR(val).replace(',00','')}</text>`;
  }
  const xlabels = series.map((d,i)=>`<text x="${x(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${weekLabel(d.date)}</text>`).join('');
  const dots = series.map((d,i)=>`<circle class="dot" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(d.value).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="overflow:visible">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${areaD}" fill="url(#areaGrad)" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${xlabels}
  </svg>`;
  const tip = document.createElement('div'); tip.className='svg-tip'; tip.style.display='none'; container.appendChild(tip);
  container.querySelectorAll('circle.dot').forEach(c=>{
    const show = (ev)=>{
      const i = +c.getAttribute('data-i'); const d = series[i];
      tip.style.display='block'; tip.textContent = `${weekLabel(d.date)}: ${fmtEUR(d.value)}`;
      const rect = container.getBoundingClientRect(); const cx = c.cx.baseVal.value/w*rect.width; const cy = c.cy.baseVal.value/h*rect.height;
      tip.style.left = cx+'px'; tip.style.top = cy+'px';
      c.setAttribute('r','6');
    };
    const hide = ()=>{ tip.style.display='none'; c.setAttribute('r','4'); };
    c.addEventListener('mouseenter', show); c.addEventListener('mouseleave', hide);
    c.addEventListener('touchstart', show, {passive:true}); c.addEventListener('touchend', hide);
  });
}
function svgSparkline(container, series, opts){
  if(!container || series.length<2) return;
  const w = Math.max(200, container.clientWidth||240), h = opts&&opts.h||64;
  const pad = {l:8,r:8,t:10,b:10};
  const vals = series.map(d=>d.price);
  const maxY = Math.max(...vals)*1.08, minY = Math.min(...vals)*0.92;
  const x = i => pad.l + (i/(series.length-1))*(w-pad.l-pad.r);
  const y = v => h-pad.b - ((v-minY)/((maxY-minY)||1))*(h-pad.t-pad.b);
  const d = series.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.price).toFixed(1)}`).join(' ');
  const last = series.length-1;
  const trendColor = series[last].price > series[0].price ? 'var(--critical)' : 'var(--good)';
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <path d="${d}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(last).toFixed(1)}" cy="${y(series[last].price).toFixed(1)}" r="4" fill="${trendColor}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}
function drawStatistikCharts(){
  const {from,to} = rangeForFilter(statFilter, statCustomFrom, statCustomTo);
  const shoppings = shoppingsInRange(from,to);
  const weekMap = {};
  shoppings.forEach(s=>{ const ws = startOfWeek(s.date).getTime(); weekMap[ws]=(weekMap[ws]||0)+totalOfShopping(s); });

}

  const items = store.shoppingList.slice().sort((a,b)=>a.order-b.order);
  const idx = items.findIndex(i=>i.id===id); const swapIdx = idx+dir;

/* ---- Scan ---- */
function compressImage(dataUrl, maxW, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW/img.width);
      const w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      try{ resolve(canvas.toDataURL('image/jpeg', quality)); }catch(e){ resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function onReceiptFile(ev){
  const file = ev.target.files && ev.target.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Bitte ein Bild auswählen.', true); return; }
  const reader = new FileReader();
  reader.onerror = () => toast('Datei konnte nicht gelesen werden.', true);
  reader.onload = () => {
    compressImage(reader.result, 1000, 0.72).then(dataUrl=>{
      runRealScan(dataUrl);
    });
  };
  reader.readAsDataURL(file);
}

/* Tesseract.js wird erst bei Bedarf per CDN nachgeladen (kein Build-Schritt/Bundling
   in diesem Projekt). Im Claude-Artifact-Viewer blockiert die strikte CSP externe
   Skripte/Netzwerkzugriffe – das schlägt dort also fehl und landet gezielt im
   error-Status mit "Manuell erfassen" als Ausweg; auf GitHub Pages/npx serve/file://
   funktioniert es normal. */
const TESSERACT_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const timer = setTimeout(()=>reject(new Error('Zeitüberschreitung beim Laden der Texterkennung')), 15000);
    const s = document.createElement('script');
    s.src = TESSERACT_CDN;
    s.onload = () => { clearTimeout(timer); window.Tesseract ? resolve(window.Tesseract) : reject(new Error('Texterkennung nicht verfügbar')); };
    s.onerror = () => { clearTimeout(timer); reject(new Error('Texterkennung konnte nicht geladen werden (keine Internetverbindung oder durch Sandbox blockiert)')); };
    document.head.appendChild(s);
  });
  tesseractLoadPromise.catch(()=>{ tesseractLoadPromise = null; });
  return tesseractLoadPromise;
}
async function runRealScan(imageData){
  scanState = { status:'scanning', imageData, draft:null, error:null, progress:0 };
  render();
  try{
    const Tesseract = await loadTesseract();
    const { data } = await Tesseract.recognize(imageData, 'deu', {
      logger: m => {
        if(m.status==='recognizing text' && typeof m.progress==='number'){
          const pct = Math.round(m.progress*100);
          if(pct !== scanState.progress && scanState.status==='scanning'){ scanState.progress = pct; render(); }
        }
      }
    });
    const draft = parseReceiptText(data.text, imageData);
    if(!draft.items.length){
      scanState = { status:'error', imageData, draft:null, error:'Es konnten keine Produkte auf dem Foto erkannt werden. Achte auf gute Beleuchtung und einen vollständigen, scharfen Kassenzettel.' };
    } else {
      scanState = { status:'review', imageData, draft, error:null };
    }
  }catch(err){
    scanState = { status:'error', imageData, draft:null, error: (err && err.message) || 'Texterkennung fehlgeschlagen.' };
  }
  render();
}
const RECEIPT_NOISE = /(summe|gesamt|total|zwischensumme|zu\s*zahlen|gegeben|rückgeld|zurück|\bbar\b|ec[- ]?cash|kartenzahlung|girocard|mwst|\bust\b|steuer|\bnetto\b|\bbrutto\b|\btse\b|kassenbon|\bbeleg\b|bon-?nr|kunden-?nr|trans-?nr|vielen dank|betrag|öffnungszeiten|tel\.?:|www\.|straße|strasse|\bstr\.|geöffnet|kassierer|bediener|pfand|uhrzeit|datum)/i;
function parseReceiptText(text, imageData){
  const rawLines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);

  let market = null;
  const knownMarkets = store.markets.filter(m=>m.name!=='Sonstige');
  for(const line of rawLines.slice(0,8)){
    const hit = knownMarkets.find(m => normName(line).includes(normName(m.name)));
    if(hit){ market = hit.name; break; }
  }
  if(!market) market = (knownMarkets[0] || store.markets[0]).name;

  let date = new Date().toISOString();
  const dateMatch = text.match(/\b(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})\b/);
  if(dateMatch){
    let [, d, mo, y] = dateMatch;
    if(y.length===2) y = '20'+y;
    const parsed = new Date(+y, +mo-1, +d);
    if(!isNaN(parsed)) date = parsed.toISOString();
  }

  let total = null;
  const totalLine = rawLines.find(l => /(summe|gesamt|total)/i.test(l) && !/zwischensumme/i.test(l));
  if(totalLine){
    const nums = totalLine.match(/(\d{1,4}[.,]\d{2})/g);
    if(nums) total = parseFloat(nums[nums.length-1].replace(',','.'));
  }

  const items = [];
  const priceRe = /(\d{1,4}[.,]\d{2})\s*[A-Za-z]?\s*$/;
  const qtyRe = /^(\d{1,2})\s*[xX]\s*/;
  for(const line of rawLines){
    if(RECEIPT_NOISE.test(line)) continue;
    if(/^[\d.,\s]+$/.test(line)) continue;
    const priceMatch = line.match(priceRe);
    if(!priceMatch) continue;
    let name = line.slice(0, priceMatch.index).trim();
    let quantity = 1;
    const qtyMatch = name.match(qtyRe);
    if(qtyMatch){ quantity = parseInt(qtyMatch[1],10) || 1; name = name.slice(qtyMatch[0].length).trim(); }
    name = name.replace(/[*#]+$/,'').trim();
    if(name.length < 2 || normName(name) === normName(market)) continue;
    const price = parseFloat(priceMatch[1].replace(',','.'));
    if(!(price > 0) || price > 500) continue;
    const existing = store.products.find(p => normName(p.name) === normName(name));
    items.push({
      name,
      quantity,
      unit: existing ? existing.defaultUnit : 'Stück',
      price: Math.round(price*100)/100,
      categoryId: existing ? existing.categoryId : classifyProduct(name),
      isNew: !existing,
    });
  }

  return { market, date, total, items, imageData };
}
function startManualEntry(){
  scanState = { status:'review', imageData:null, draft:{ market: store.markets[0].name, date:new Date().toISOString(), total:null, items:[], imageData:null }, error:null };

}

function updateScanTotalDisplay(){

}

function confirmScan(){
  const d = scanState.draft;

  if(!d.market){ toast('Bitte einen Markt wählen.', true); return; }
  const items = d.items.map(it=>{

    return { id:uid(), productId:prod.id, name:it.name, quantity:it.quantity||1, unit:it.unit||'Stück', price:it.price||0, categoryId:it.categoryId };
  });
  const total = Math.round(items.reduce((a,i)=>a+i.price,0)*100)/100;
  const shopping = { id:uid(), market:d.market, date:d.date, total, receiptImage:d.imageData||null, items,
    source: d.imageData?'scan':'manual', isDemo:false, createdAt:nowIso() };
  store.shoppings.unshift(shopping);
  items.forEach(it=>{
    const prod = prodById(it.productId);
    prod.purchaseCount++; prod.lastPurchasedAt = shopping.date; prod.defaultPrice = it.price; prod.updatedAt = nowIso();
    if(prod.categoryId !== it.categoryId) prod.categoryId = it.categoryId;
    store.priceHistory.push({ id:uid(), productId:prod.id, shoppingId:shopping.id, price:it.price, date:shopping.date, market:d.market });
  });
  saveStore(); scanState = {status:'idle', imageData:null, draft:null, error:null};
  toast('Einkauf gespeichert · '+fmtEUR(total));
  nav('verlauf/'+shopping.id);
}

  ev.preventDefault(); const f=ev.target; const name=f.name.value.trim(); if(!name) return false;

  if(barcode && store.products.some(p=>p.barcode===barcode && p.id!==id)){ toast('Barcode wird bereits verwendet.', true); return false; }
  if(id){
    const p = prodById(id);
    p.name=name; p.categoryId=f.categoryId.value; p.defaultUnit=f.defaultUnit.value;
    p.defaultQuantity=parseFloat(f.defaultQuantity.value)||1; p.defaultPrice = f.defaultPrice.value!=='' ? parseFloat(f.defaultPrice.value) : null;
    p.barcode=barcode; p.note=f.note.value.trim(); p.favorite=f.favorite.checked; p.updatedAt=nowIso();
  } else {
    store.products.push({ id:uid(), name, categoryId:f.categoryId.value, barcode, defaultQuantity: parseFloat(f.defaultQuantity.value)||1,
      defaultUnit:f.defaultUnit.value, defaultPrice: f.defaultPrice.value!=='' ? parseFloat(f.defaultPrice.value) : null, favorite:f.favorite.checked,
      note:f.note.value.trim(), createdAt:nowIso(), updatedAt:nowIso(), lastPurchasedAt:null, purchaseCount:0, isDemo:false });

  return false;

function nativeDownload(filename, data){
  const mime = filename.endsWith('.json') ? 'application/json'
    : filename.endsWith('.csv') ? 'text/csv;charset=utf-8'
    : 'text/plain;charset=utf-8';
  const blob = new Blob([data], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function offerDownload(filename, data, isCsv){
  const inClaudeViewer = !!(window.claude && window.claude.use);
  if(!inClaudeViewer){
    /* Plain browser (e.g. GitHub Pages, file://) — no Claude runtime involved at all. */
    try{ nativeDownload(filename, data); toast('Datei heruntergeladen'); }
    catch(e){ toast('Download fehlgeschlagen.', true); }
    return;
  }
  /* Inside the Claude Artifact viewer, a plain <a download> link is inert —
     must go through the downloads capability instead. */
  try{
    const downloads = await window.claude.use('downloads');
    if(!downloads){ toast('Download ist in dieser Ansicht nicht verfügbar.', true); return; }
    await downloads.save({filename, data});
    toast('Datei gespeichert');
  }catch(e){
    const code = e && e.code;
    if(code==='extension_not_enabled' && isCsv){
      try{
        const downloads = await window.claude.use('downloads');
        await downloads.save({filename: filename.replace(/\.csv$/,'.txt'), data});
        toast('Als .txt gespeichert (CSV-Export ist hier nicht aktiviert)');
        return;
      }catch(e2){ /* fall through to generic error */ }
    }
    if(code==='declined') return;
    toast('Download fehlgeschlagen.', true);
  }
}
async function exportJson(){
  await offerDownload(`wochenkorb-export-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(store, null, 2));
}
async function exportCsv(){
  const rows = [['Datum','Markt','Produkt','Menge','Einheit','Preis','Produktgruppe']];
  store.shoppings.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(s=>{
    s.items.forEach(i=>{ rows.push([fmtDate(s.date), s.market, i.name, i.quantity, i.unit, i.price.toFixed(2).replace('.',','), catById(i.categoryId)?catById(i.categoryId).name:'']); });
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  await offerDownload(`wochenkorb-historie-${new Date().toISOString().slice(0,10)}.csv`, csv, true);
}
function importJson(ev){
  const file = ev.target.files && ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => toast('Datei konnte nicht gelesen werden.', true);
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.products) || !Array.isArray(data.shoppings) || !Array.isArray(data.categories)){
        toast('Ungültige Datei – kein gültiger Wochenkorb-Export.', true); return;
      }
      confirmDialog('Daten importieren', 'Vorhandene Daten werden durch die Importdatei ersetzt. Fortfahren?', ()=>{
        store = data; seedDefaults(store);
        if(!store.settings) store.settings = { theme:'system', firstRunDone:true, demoActive:false, recurringTemplate:[] };
        if(!store.categoryCorrections) store.categoryCorrections = {};
        if(!Array.isArray(store.priceHistory)) store.priceHistory = [];
        saveStore(); applyTheme(); closeModal(); nav(''); toast('Daten importiert');
      });
    }catch(e){ toast('Datei konnte nicht gelesen werden – ungültiges JSON.', true); }
  };
  reader.readAsText(file);
}
