function startOfWeek(d){ const dt=new Date(d); const day=(dt.getDay()+6)%7; dt.setHours(0,0,0,0); dt.setDate(dt.getDate()-day); return dt; }
function endOfWeek(d){ const s=startOfWeek(d); const e=new Date(s); e.setDate(s.getDate()+6); e.setHours(23,59,59,999); return e; }
function startOfMonth(d){ const dt=new Date(d); return new Date(dt.getFullYear(), dt.getMonth(), 1); }
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
function escAttr(s){ return esc(s).replace(/\n/g,' '); }

/* ============================= Store / persistence ============================= */
const STORAGE_KEY = 'wochenkorb.store.v1';
let storageOK = true;
let store = null;

function freshStore(){
  return {
    version:1,
    categories: [],
    products: [],
    shoppingList: [],
    shoppings: [],
    priceHistory: [],
    markets: [],
    categoryCorrections: {},
    settings: { theme:'system', firstRunDone:false, demoActive:false, recurringTemplate:[] },
  };
}
function seedDefaults(s){
  if(s.categories.length===0){
    s.categories = DEFAULT_CATEGORIES.map(c => ({id:'cat_'+c.key, name:c.name, icon:c.icon, isDefault:true, createdAt:nowIso()}));
  }
  if(s.markets.length===0){
    s.markets = DEFAULT_MARKETS.map(m => ({id:'mkt_'+normName(m).replace(/\s+/g,'-'), name:m, isDefault:true}));
  }
}
function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ store = JSON.parse(raw); }
    else { store = freshStore(); }
  }catch(e){ storageOK=false; store = freshStore(); }
  seedDefaults(store);
  if(!store.settings) store.settings = { theme:'system', firstRunDone:false, demoActive:false, recurringTemplate:[] };
  if(!store.categoryCorrections) store.categoryCorrections = {};
  if(!Array.isArray(store.priceHistory)) store.priceHistory = [];
}
function saveStore(){
  if(!storageOK) return;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }
  catch(e){ storageOK=false; toast('Lokaler Speicher nicht verfügbar – Änderungen werden evtl. nicht gespeichert.', true); }
}
function catById(id){ return store.categories.find(c=>c.id===id); }
function catByName(name){ return store.categories.find(c=>normName(c.name)===normName(name)); }
function sonstigeId(){ return (store.categories.find(c=>c.key==='sonstiges') || catByName('Sonstiges') || store.categories.find(c=>/sonstig/i.test(c.name)) || store.categories[store.categories.length-1]).id; }
function prodById(id){ return store.products.find(p=>p.id===id); }
function marketById(id){ return store.markets.find(m=>m.id===id); }

function classifyProduct(name){
  const n = normName(name);
  if(store.categoryCorrections[n]) return store.categoryCorrections[n];
  for(const [key, words] of Object.entries(CATEGORY_KEYWORDS)){
    if(words.some(w => n.includes(w))){
      const c = store.categories.find(c=>c.id==='cat_'+key) || store.categories.find(c=>normName(c.name).includes(key));
      if(c) return c.id;
    }
  }
  return sonstigeId();
}
function rememberCorrection(name, categoryId){ store.categoryCorrections[normName(name)] = categoryId; }

function findOrCreateProduct(name, categoryId, unit, price){
  let p = store.products.find(p => normName(p.name)===normName(name));
  if(p) return p;
  p = {
    id: uid(), name: name.trim(), categoryId: categoryId || classifyProduct(name), barcode:null,
    defaultQuantity:1, defaultUnit: unit || 'Stück', defaultPrice: price ?? null, favorite:false, note:'',
    createdAt: nowIso(), updatedAt: nowIso(), lastPurchasedAt:null, purchaseCount:0, isDemo:false,
  };
  store.products.push(p);
  return p;
}

/* ============================= Demo data ============================= */
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function seedDemoData(){
  const products = DEMO_PRODUCT_POOL.map(([name,catKey,unit,qty,price]) => ({
    id:'dp_'+uid(), name, categoryId:'cat_'+catKey, barcode:null, defaultQuantity:qty, defaultUnit:unit,
    defaultPrice:price, favorite: Math.random()<0.18, note:'', createdAt:nowIso(), updatedAt:nowIso(),
    lastPurchasedAt:null, purchaseCount:0, isDemo:true,
  }));
  store.products.push(...products);

  const today = new Date();
  const numShoppings = 7;
  for(let w=numShoppings; w>=1; w--){
    const d = new Date(today); d.setDate(d.getDate() - w*6 - Math.floor(Math.random()*2));
    const market = store.markets[Math.floor(Math.random()*(store.markets.length-1))];
    const itemCount = 6 + Math.floor(Math.random()*7);
    const chosen = [...products].sort(()=>Math.random()-0.5).slice(0, itemCount);
    let total = 0;
    const items = chosen.map(p => {
      const jitter = 1 + (Math.random()*0.16 - 0.08);
      const price = Math.max(0.29, Math.round(p.defaultPrice * jitter * 100)/100);
      const qty = p.defaultQuantity;
      total += price;
      return { id: uid(), productId:p.id, name:p.name, quantity:qty, unit:p.defaultUnit, price, categoryId:p.categoryId };
    });
    const shopping = {
      id:'ds_'+uid(), market: market.name, date: d.toISOString(), total: Math.round(total*100)/100,
      receiptImage:null, items, source:'demo', isDemo:true, createdAt: d.toISOString(),
    };
    store.shoppings.push(shopping);
    items.forEach(it => {
      const prod = prodById(it.productId);
      if(prod){ prod.purchaseCount++; if(!prod.lastPurchasedAt || d > new Date(prod.lastPurchasedAt)) prod.lastPurchasedAt = d.toISOString(); }
      store.priceHistory.push({ id:uid(), productId: it.productId, shoppingId: shopping.id, price: it.price, date: d.toISOString(), market: market.name });
    });
  }
  store.shoppings.sort((a,b)=> new Date(b.date) - new Date(a.date));

  const openPicks = [...products].sort(()=>Math.random()-0.5).slice(0,5);
  store.shoppingList = openPicks.map((p,i)=>({
    id:uid(), productId:p.id, name:p.name, quantity:p.defaultQuantity, unit:p.defaultUnit, categoryId:p.categoryId,
    estimatedPrice:p.defaultPrice, checked:false, note:'', order:i, createdAt:nowIso(), purchasedAt:null,
  }));
  store.settings.demoActive = true;
}
function removeDemoData(){
  store.products = store.products.filter(p=>!p.isDemo);
  store.shoppings = store.shoppings.filter(s=>!s.isDemo);
  store.shoppingList = store.shoppingList.filter(i=>{
    const p = prodById(i.productId); return !(p && p.isDemo) ;
  });
  store.priceHistory = store.priceHistory.filter(ph => prodById(ph.productId));
  store.settings.demoActive = false;
  saveStore(); render();
  toast('Demo-Daten entfernt.');
}

function toast(msg, isWarn){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (isWarn ? ' toast-warn' : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(), 250); }, 2600);
}

function currentRoute(){
  const hash = location.hash.replace(/^#\/?/, '');
  const [path, param] = hash.split('/');
  return { path: path||'', param };
}
function renderNav(){
  const {path} = currentRoute();
  const bottom = document.getElementById('bottomnav');
  bottom.innerHTML = ROUTES.map(r => {
    if(r.key==='scan'){
      return `<button class="navitem scan" onclick="App.nav('${r.path}')"><span class="ic-wrap"><span class="ic">${r.icon}</span></span><span>${r.label}</span></button>`;
    }
    return `<button class="navitem ${path===r.path?'active':''}" onclick="App.nav('${r.path}')"><span class="ic">${r.icon}</span><span>${r.label}</span></button>`;
  }).join('');

  const side = document.getElementById('sidebar');
  const all = [...ROUTES, ...MORE_ROUTES];
  side.innerHTML = `<div class="brand"><span>🧺</span> Wochenkorb</div>` +
    all.map(r => `<a class="navitem ${path===r.path?'active':''}" href="#/${r.path}"><span class="ic">${r.icon}</span><span>${r.label}</span></a>`).join('') ;
}

function render(){
  renderNav();
  const {path, param} = currentRoute();
  const view = document.getElementById('view');
  let html = '';
  try{
    switch(path){
      case '': html = viewDashboard(); break;
      case 'liste': html = viewListe(); break;
      case 'scan': html = viewScan(); break;
      case 'verlauf': html = param ? viewVerlaufDetail(param) : viewVerlauf(); break;
      case 'statistik': html = viewStatistik(); break;
      case 'produkte': html = param ? viewProduktDetail(param) : viewProdukte(); break;
      case 'kategorien': html = viewKategorien(); break;
      case 'maerkte': html = viewMaerkte(); break;
      case 'suche': html = viewSuche(); break;
      case 'einstellungen': html = viewEinstellungen(); break;
      default: html = viewDashboard();
    }
  }catch(err){
    console.error(err);
    html = `<div class="card"><div class="empty"><span class="emoji">⚠️</span><div class="t1">Etwas ist schiefgelaufen</div><p>${esc(err.message)}</p></div></div>`;
  }
  view.innerHTML = html;
  window.scrollTo(0,0);
  afterRender(path);
}
function afterRender(path){
  if(path==='statistik') requestAnimationFrame(drawStatistikCharts);
  if(path==='dashboard' || path==='') requestAnimationFrame(drawDashboardMiniChart);
  if(path==='produkte' && currentRoute().param) requestAnimationFrame(drawProductSparkline);
}

/* ============================= Derived data helpers ============================= */
function shoppingsInRange(fromDate, toDate){
  return store.shoppings.filter(s => { const d=new Date(s.date); return d>=fromDate && d<=toDate; });
}
function totalOfShopping(s){ return s.items.reduce((a,i)=>a+ (i.price||0), 0); }
function weekLabel(d){ return fmtDate(d, {day:'2-digit',month:'2-digit'}); }

function rangeForFilter(filterKey, customFrom, customTo){
  const now = new Date();
  let from = new Date(now); let to = new Date(now); to.setHours(23,59,59,999);
  switch(filterKey){
    case '7d': from.setDate(now.getDate()-6); break;
    case '4w': from.setDate(now.getDate()-27); break;
    case '1m': from.setMonth(now.getMonth()-1); break;
    case '3m': from.setMonth(now.getMonth()-3); break;
    case '1y': from.setFullYear(now.getFullYear()-1); break;
    case 'custom': from = customFrom? new Date(customFrom): new Date(now.setMonth(now.getMonth()-1)); to = customTo? new Date(customTo): to; to.setHours(23,59,59,999); break;
    default: from.setMonth(now.getMonth()-1);
  }
  from.setHours(0,0,0,0);
  return {from, to};
}
function avgPurchaseIntervalDays(productId){
  const dates = store.priceHistory.filter(p=>p.productId===productId).map(p=>new Date(p.date)).sort((a,b)=>a-b);
  if(dates.length<2) return null;
  let diffs=[]; for(let i=1;i<dates.length;i++) diffs.push(daysBetween(dates[i-1],dates[i]));
  return diffs.reduce((a,b)=>a+b,0)/diffs.length;
}
function avgPrice(productId){
  const arr = store.priceHistory.filter(p=>p.productId===productId);
  if(!arr.length) return null;
  return arr.reduce((a,b)=>a+b.price,0)/arr.length;
}

function suggestProducts(query){
  const n = normName(query);
  if(!n) return [];
  const scored = store.products.map(p=>{
    const pn = normName(p.name);
    let score = -1;
    if(pn===n) score=100; else if(pn.startsWith(n)) score=80; else if(pn.includes(n)) score=50;
    if(score<0) return null;
    score += p.favorite?10:0; score += Math.min(p.purchaseCount,10);
    return {p, score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,6).map(x=>x.p);
  return scored;
}

function viewScanReview(){
  const d = scanState.draft;

  // deshalb hier gegenrechnen, statt die Erkennung fälschlich als fehlerhaft zu melden.
  const expectedTotal = d.total!=null ? Math.round((d.total - (d.excludedAdjustment||0))*100)/100 : null;
  const mismatch = expectedTotal!=null && Math.abs(computedTotal - expectedTotal) > 0.02;
  return `
  <div class="card">
    <div class="row between" style="margin-bottom:10px">
      <h3 style="font-size:16px">${d.imageData?'Erkannter Einkauf':'Manueller Einkauf'}</h3>

        <tbody>
        ${d.items.map((it,idx)=>`
          <tr>
            <td><input type="text" value="${escAttr(it.name)}" oninput="App.updateDraftItem(${idx},'name',this.value)" style="min-width:120px">${it.isNew?'<span class="badge badge-good" style="margin-top:4px">Neu</span>':''}</td>
            <td style="white-space:nowrap"><input type="number" min="0" step="0.1" value="${it.quantity}" oninput="App.updateDraftItem(${idx},'quantity',this.value)" style="width:56px; display:inline-block; padding:8px 6px">

            <td><input type="number" min="0" step="0.01" value="${it.price}" oninput="App.updateDraftItem(${idx},'price',this.value)" style="width:72px"></td>
            <td><select onchange="App.updateDraftItem(${idx},'categoryId',this.value)" style="min-width:120px">${categorySelectOptions(it.categoryId)}</select></td>
            <td><button class="iconbtn-sm" onclick="App.removeDraftItem(${idx})">🗑️</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <button class="btn btn-outline btn-sm" style="margin-top:10px" onclick="App.addDraftItem()">➕ Produkt hinzufügen</button>
    <hr class="hairline">
    <div class="row between">
      <span style="font-weight:700">Summe</span>
      <span class="hero-num tabular" id="scan-total" style="font-size:22px">${fmtEUR(computedTotal)}</span>
    </div>
    ${mismatch ? `<p style="font-size:12px; color:var(--warn); margin-top:4px">⚠️ Laut Bon-Summe (${fmtEUR(d.total)}${d.excludedAdjustment?', abzüglich Pfand/Rabatt':''}) sollten die Produkte ${fmtEUR(expectedTotal)} ergeben – bitte Preise prüfen.</p>`:''}

let statFilter = '1m';
let statCustomFrom = null, statCustomTo = null;
let statSelectedProduct = null;

function viewStatistik(){
  const {from, to} = rangeForFilter(statFilter, statCustomFrom, statCustomTo);
  const shoppings = shoppingsInRange(from, to);
  const totalSpend = shoppings.reduce((a,s)=>a+totalOfShopping(s),0);
  const weeks = Math.max(1, (to-from)/(7*86400000));
  const months = Math.max(1, (to-from)/(30.4*86400000));
  const avgPerShopping = shoppings.length? totalSpend/shoppings.length : 0;
  const avgPerWeek = totalSpend/weeks;
  const avgPerMonth = totalSpend/months;

  const weekMap = {};
  shoppings.forEach(s=>{ const ws = startOfWeek(s.date).getTime(); weekMap[ws]=(weekMap[ws]||0)+totalOfShopping(s); });
  const weekKeys = Object.keys(weekMap).map(Number).sort((a,b)=>a-b);
  const weekSeries = weekKeys.map(k=>({date:new Date(k), value:weekMap[k]}));

  const spendByCat = {}; const countByCat = {};
  shoppings.forEach(s=>s.items.forEach(it=>{ spendByCat[it.categoryId]=(spendByCat[it.categoryId]||0)+it.price; countByCat[it.categoryId]=(countByCat[it.categoryId]||0)+1; }));
  const spendEntries = Object.entries(spendByCat).sort((a,b)=>b[1]-a[1]);
  const countEntries = Object.entries(countByCat).sort((a,b)=>b[1]-a[1]);
  const spendTop = spendEntries.slice(0,7); const spendOtherSum = spendEntries.slice(7).reduce((a,[,v])=>a+v,0);
  const countTop = countEntries.slice(0,7); const countOtherSum = countEntries.slice(7).reduce((a,[,v])=>a+v,0);
  const spendTotal = spendEntries.reduce((a,[,v])=>a+v,0) || 1;
  const countTotal = countEntries.reduce((a,[,v])=>a+v,0) || 1;

  const purchasedProducts = store.products.filter(p=>p.purchaseCount>0).sort((a,b)=>a.name.localeCompare(b.name));
  const selProd = statSelectedProduct ? prodById(statSelectedProduct) : null;
  const priceSeries = selProd ? store.priceHistory.filter(p=>p.productId===selProd.id).sort((a,b)=>new Date(a.date)-new Date(b.date)) : [];
  let priceDeltaTxt = '';
  if(priceSeries.length>=2){
    const last = priceSeries[priceSeries.length-1], prev = priceSeries[priceSeries.length-2];
    const pct = ((last.price - prev.price)/prev.price*100);
    priceDeltaTxt = `<span class="badge ${pct>0?'badge-critical':'badge-good'}">${pct>0?'▲':'▼'} ${Math.abs(pct).toFixed(1)}% ggü. letztem Einkauf</span>`;
  }

  return `
  <div class="stack">
    <h1 style="font-size:22px">Auswertungen</h1>
    <div class="chiprow">
      ${[['7d','7 Tage'],['4w','4 Wochen'],['1m','1 Monat'],['3m','3 Monate'],['1y','1 Jahr'],['custom','Individuell']].map(([k,l])=>
        `<button class="chip chip-btn ${statFilter===k?'active':''}" onclick="App.setStatFilter('${k}')">${l}</button>`).join('')}
    </div>
    ${statFilter==='custom' ? `
    <div class="card row" style="gap:10px">
      <label class="field" style="flex:1">Von<input type="date" value="${statCustomFrom||''}" onchange="App.setStatCustom('from',this.value)"></label>
      <label class="field" style="flex:1">Bis<input type="date" value="${statCustomTo||''}" onchange="App.setStatCustom('to',this.value)"></label>
    </div>`:''}

    <div class="grid2 grid2-desk3">
      <div class="stat-tile"><div class="val tabular">${fmtEUR(totalSpend)}</div><div class="lbl">Gesamtausgaben</div></div>
      <div class="stat-tile"><div class="val tabular">${shoppings.length}</div><div class="lbl">Einkäufe</div></div>
      <div class="stat-tile"><div class="val tabular">${fmtEUR(avgPerShopping)}</div><div class="lbl">Ø pro Einkauf</div></div>
      <div class="stat-tile"><div class="val tabular">${fmtEUR(avgPerWeek)}</div><div class="lbl">Ø pro Woche</div></div>
      <div class="stat-tile"><div class="val tabular">${fmtEUR(avgPerMonth)}</div><div class="lbl">Ø pro Monat</div></div>
    </div>

    <div class="card">
      <h3 style="font-size:15px; margin-bottom:10px">Ausgaben pro Woche</h3>
      ${weekSeries.length<2 ? `<p style="font-size:12.5px;color:var(--muted)">Noch nicht genug Daten im gewählten Zeitraum.</p>` : `<div class="chart-wrap" id="linechart-wrap"></div>`}
    </div>

    <div class="card">
      <h3 style="font-size:15px; margin-bottom:10px">Ausgaben nach Produktgruppe</h3>
      ${spendTop.length===0 ? `<p style="font-size:12.5px;color:var(--muted)">Keine Daten im gewählten Zeitraum.</p>` :
        spendTop.map(([cid,val])=>{ const c=catById(cid); return `<div class="barrow"><div class="lbl">${c?c.icon:'📦'} ${c?esc(c.name):'Sonstiges'}</div><div class="track"><div class="fill" style="width:${val/spendTotal*100}%; background:${catColorVar(cid)}"></div></div><div class="val tabular">${(val/spendTotal*100).toFixed(0)}%</div></div>`;}).join('')}
      ${spendOtherSum>0 ? `<div class="barrow"><div class="lbl">📦 Sonstige</div><div class="track"><div class="fill" style="width:${spendOtherSum/spendTotal*100}%; background:var(--muted)"></div></div><div class="val tabular">${(spendOtherSum/spendTotal*100).toFixed(0)}%</div></div>`:''}
    </div>

    <div class="card">
      <h3 style="font-size:15px; margin-bottom:10px">Anzahl gekaufter Produkte nach Gruppe</h3>
      ${countTop.length===0 ? `<p style="font-size:12.5px;color:var(--muted)">Keine Daten im gewählten Zeitraum.</p>` :
        countTop.map(([cid,val])=>{ const c=catById(cid); return `<div class="barrow"><div class="lbl">${c?c.icon:'📦'} ${c?esc(c.name):'Sonstiges'}</div><div class="track"><div class="fill" style="width:${val/countTotal*100}%; background:${catColorVar(cid)}"></div></div><div class="val tabular">${val}×</div></div>`;}).join('')}
      ${countOtherSum>0 ? `<div class="barrow"><div class="lbl">📦 Sonstige</div><div class="track"><div class="fill" style="width:${countOtherSum/countTotal*100}%; background:var(--muted)"></div></div><div class="val tabular">${countOtherSum}×</div></div>`:''}
    </div>

    <div class="card">
      <h3 style="font-size:15px; margin-bottom:10px">Preisentwicklung</h3>
      <select onchange="App.setStatProduct(this.value)" style="margin-bottom:12px">
        <option value="">Produkt wählen…</option>
        ${purchasedProducts.map(p=>`<option value="${p.id}" ${p.id===statSelectedProduct?'selected':''}>${esc(p.name)}</option>`).join('')}
      </select>
      ${selProd ? (priceSeries.length<2 ? `<p style="font-size:12.5px;color:var(--muted)">Noch nicht genug Käufe für einen Trend.</p>` : `
        <div class="row between" style="margin-bottom:8px"><span style="font-weight:700">${esc(selProd.name)}</span>${priceDeltaTxt}</div>
        <div class="chart-wrap" id="sparkline-stat-wrap"></div>
        <div class="tablewrap" style="margin-top:10px"><table>
          <thead><tr><th>Datum</th><th>Markt</th><th style="text-align:right">Preis</th></tr></thead>
          <tbody>${priceSeries.slice().reverse().map(p=>`<tr><td>${fmtDate(p.date)}</td><td>${esc(p.market||'–')}</td><td class="tabular" style="text-align:right">${fmtEUR(p.price)}</td></tr>`).join('')}</tbody>
        </table></div>
      `) : `<p style="font-size:12.5px;color:var(--muted)">Wähle ein Produkt, um die Preisentwicklung zu sehen.</p>`}
    </div>
  </div>`;
}

function svgLine(container, series, opts){
  if(!container) return;
  const w = Math.max(280, container.clientWidth || 300), h = opts.h||180;
  const pad = {l:38,r:14,t:14,b:26};
  const xs = series.map((_,i)=>i);
  const ys = series.map(d=>d.value);
  const maxY = Math.max(...ys, 1) * 1.15;
  const minY = 0;
  const x = i => pad.l + (i/(Math.max(series.length-1,1))) * (w-pad.l-pad.r);
  const y = v => h-pad.b - ((v-minY)/(maxY-minY||1)) * (h-pad.t-pad.b);
  const pathD = series.map((d,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(d.value).toFixed(1)}`).join(' ');
  const areaD = pathD + ` L${x(series.length-1).toFixed(1)},${(h-pad.b)} L${x(0).toFixed(1)},${(h-pad.b)} Z`;
  const gridLines = 4;
  let grid='';
  for(let i=0;i<=gridLines;i++){ const gy = pad.t + i*((h-pad.t-pad.b)/gridLines); const val = maxY - i*(maxY/gridLines);
    grid += `<line x1="${pad.l}" x2="${w-pad.r}" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    grid += `<text x="${pad.l-6}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtEUR(val).replace(',00','')}</text>`;
  }
  const xlabels = series.map((d,i)=>`<text x="${x(i).toFixed(1)}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${weekLabel(d.date)}</text>`).join('');
  const dots = series.map((d,i)=>`<circle class="dot" data-i="${i}" cx="${x(i).toFixed(1)}" cy="${y(d.value).toFixed(1)}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="overflow:visible">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    <path d="${areaD}" fill="url(#areaGrad)" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
    ${xlabels}
  </svg>`;
  const tip = document.createElement('div'); tip.className='svg-tip'; tip.style.display='none'; container.appendChild(tip);
  container.querySelectorAll('circle.dot').forEach(c=>{
    const show = (ev)=>{
      const i = +c.getAttribute('data-i'); const d = series[i];
      tip.style.display='block'; tip.textContent = `${weekLabel(d.date)}: ${fmtEUR(d.value)}`;
      const rect = container.getBoundingClientRect(); const cx = c.cx.baseVal.value/w*rect.width; const cy = c.cy.baseVal.value/h*rect.height;
      tip.style.left = cx+'px'; tip.style.top = cy+'px';
      c.setAttribute('r','6');
    };
    const hide = ()=>{ tip.style.display='none'; c.setAttribute('r','4'); };
    c.addEventListener('mouseenter', show); c.addEventListener('mouseleave', hide);
    c.addEventListener('touchstart', show, {passive:true}); c.addEventListener('touchend', hide);
  });
}
function svgSparkline(container, series, opts){
  if(!container || series.length<2) return;
  const w = Math.max(200, container.clientWidth||240), h = opts&&opts.h||64;
  const pad = {l:8,r:8,t:10,b:10};
  const vals = series.map(d=>d.price);
  const maxY = Math.max(...vals)*1.08, minY = Math.min(...vals)*0.92;
  const x = i => pad.l + (i/(series.length-1))*(w-pad.l-pad.r);
  const y = v => h-pad.b - ((v-minY)/((maxY-minY)||1))*(h-pad.t-pad.b);
  const d = series.map((p,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(p.price).toFixed(1)}`).join(' ');
  const last = series.length-1;
  const trendColor = series[last].price > series[0].price ? 'var(--critical)' : 'var(--good)';
  container.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <path d="${d}" fill="none" stroke="${trendColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(last).toFixed(1)}" cy="${y(series[last].price).toFixed(1)}" r="4" fill="${trendColor}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}
function drawStatistikCharts(){
  const {from,to} = rangeForFilter(statFilter, statCustomFrom, statCustomTo);
  const shoppings = shoppingsInRange(from,to);
  const weekMap = {};
  shoppings.forEach(s=>{ const ws = startOfWeek(s.date).getTime(); weekMap[ws]=(weekMap[ws]||0)+totalOfShopping(s); });
  const weekKeys = Object.keys(weekMap).map(Number).sort((a,b)=>a-b);

}

/* ---- Voice input (Web Speech API) ---- */
const VOICE_LEAD_RE = /^(bitte\s+|füge\s+|fuege\s+|setze\s+|kaufe\s+noch\s+|kaufe\s+|hol\s+mir\s+noch\s+|hol\s+mir\s+|hol\s+noch\s+|hol\s+|besorge\s+noch\s+|besorge\s+|ich\s+brauche\s+noch\s+|ich\s+brauche\s+|wir\s+brauchen\s+noch\s+|wir\s+brauchen\s+)+/i;
const VOICE_TAIL_RE = /(\s+auf\s+die\s+einkaufsliste|\s+auf\s+die\s+liste|\s+auf\s+meine\s+liste|\s+hinzufügen|\s+hinzufuegen|\s+hinzu|\s+dazu)+[.!\s]*$/i;
const VOICE_LEAD_WORD_RE = /^(noch|auch|dann|außerdem|ausserdem|und)\s+/i;
const VOICE_ARTICLE_RE = /^(der|die|das|den|dem)\s+/i;

function parseVoiceCommand(text){
  let t = text.trim().replace(/[.!?]+$/,'');
  t = t.replace(VOICE_LEAD_RE, '').replace(VOICE_TAIL_RE, '').trim();
  if(!t) return [];
  const segments = t.split(/\s*,\s*|\s+und\s+|\s+sowie\s+|\s*\+\s*/i);
  const items = [];
  segments.forEach(seg=>{
    seg = seg.trim().replace(VOICE_LEAD_WORD_RE, '').trim();
    if(!seg) return;
    let quantity = null;
    const digitMatch = seg.match(/^(\d+(?:[.,]\d+)?)\s+(.+)$/);
    if(digitMatch){
      quantity = parseFloat(digitMatch[1].replace(',', '.'));
      seg = digitMatch[2];
    } else {
      const wordMatch = seg.match(/^([a-zäöüß]+)\s+(.+)$/i);
      if(wordMatch && VOICE_NUMBER_WORDS[wordMatch[1].toLowerCase()]){
        quantity = VOICE_NUMBER_WORDS[wordMatch[1].toLowerCase()];
        seg = wordMatch[2];
      }
    }
    let unit = null;
    const unitMatch = seg.match(/^([a-zäöüß]+)\s+(.+)$/i);
    if(unitMatch && VOICE_UNIT_WORDS[unitMatch[1].toLowerCase()]){
      unit = VOICE_UNIT_WORDS[unitMatch[1].toLowerCase()];
      seg = unitMatch[2];
    }
    seg = seg.replace(VOICE_ARTICLE_RE, '').trim();
    if(!seg) return;
    const name = seg.charAt(0).toUpperCase() + seg.slice(1);
    items.push({ name, quantity: quantity || 1, unit });
  });
  return items;
}

function startVoiceInput(){
  if(voiceState.status==='listening'){
    if(voiceRecognition){ try{ voiceRecognition.stop(); }catch(e){} }
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast('Spracheingabe wird von diesem Gerät/Browser nicht unterstützt.', true); return; }
  let rec;
  try{ rec = new SR(); }
  catch(e){ toast('Spracheingabe konnte nicht gestartet werden.', true); return; }
  voiceRecognition = rec;
  rec.lang = 'de-DE'; rec.continuous = false; rec.interimResults = false; rec.maxAlternatives = 1;
  let handled = false;
  rec.onresult = (e)=>{
    handled = true;
    const transcript = (e.results && e.results[0] && e.results[0][0]) ? e.results[0][0].transcript : '';
    voiceState = { status:'idle' };
    processVoiceTranscript(transcript);
  };
  rec.onerror = (e)=>{
    handled = true;
    voiceState = { status:'idle' };
    const messages = {
      'not-allowed':'Mikrofonzugriff wurde verweigert. Bitte erlaube den Zugriff in den Browser-Einstellungen.',
      'service-not-allowed':'Mikrofonzugriff wurde verweigert. Bitte erlaube den Zugriff in den Browser-Einstellungen.',
      'no-speech':'Keine Sprache erkannt. Bitte versuche es erneut.',
      'audio-capture':'Es wurde kein Mikrofon gefunden.',
      'network':'Spracherkennung fehlgeschlagen (Netzwerkproblem). Bitte erneut versuchen.',
      'aborted': null,
    };
    const msg = messages.hasOwnProperty(e.error) ? messages[e.error] : 'Spracherkennung fehlgeschlagen. Bitte erneut versuchen.';
    if(msg) toast(msg, true);
    render();
  };
  rec.onend = ()=>{
    if(!handled){ voiceState = { status:'idle' }; render(); }
    voiceRecognition = null;
  };
  try{
    rec.start();
    voiceState = { status:'listening' };
    render();
  }catch(e){
    voiceState = { status:'idle' };
    toast('Spracheingabe konnte nicht gestartet werden.', true);
  }
}
function processVoiceTranscript(transcript){
  const text = (transcript||'').trim();
  if(!text){ toast('Nichts verstanden. Bitte erneut versuchen.', true); render(); return; }
  const items = parseVoiceCommand(text);
  if(!items.length){ toast('Konnte keine Produkte aus „'+text+'" erkennen.', true); render(); return; }
  voiceDraft = items; voiceRawText = text;
  render();
  openModal(voiceDraftModalHtml());
}
function updateVoiceDraftItem(idx, field, val){
  if(!voiceDraft || !voiceDraft[idx]) return;
  voiceDraft[idx][field] = field==='quantity' ? (parseFloat(val)||1) : val;

function removeVoiceDraftItem(idx){

    let p = store.products.find(pp=>normName(pp.name)===normName(name));

  if(added) toast(added+' Produkt'+(added>1?'e':'')+' hinzugefügt'+(skipped?(' · '+skipped+' bereits auf der Liste'):''));

/* ---- Scan ---- */
function compressImage(dataUrl, maxW, quality){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW/img.width);
      const w = Math.max(1,Math.round(img.width*scale)), h = Math.max(1,Math.round(img.height*scale));
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
      try{ resolve(canvas.toDataURL('image/jpeg', quality)); }catch(e){ resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}
function onReceiptFile(ev){
  const file = ev.target.files && ev.target.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')){ toast('Bitte ein Bild auswählen.', true); return; }
  const reader = new FileReader();
  reader.onerror = () => toast('Datei konnte nicht gelesen werden.', true);
  reader.onload = () => {
    compressImage(reader.result, 1000, 0.72).then(dataUrl=>{
      runRealScan(dataUrl);
    });
  };
  reader.readAsDataURL(file);
}

/* Tesseract.js wird erst bei Bedarf per CDN nachgeladen (kein Build-Schritt/Bundling
   in diesem Projekt). Im Claude-Artifact-Viewer blockiert die strikte CSP externe
   Skripte/Netzwerkzugriffe – das schlägt dort also fehl und landet gezielt im
   error-Status mit "Manuell erfassen" als Ausweg; auf GitHub Pages/npx serve/file://
   funktioniert es normal. */
const TESSERACT_CDN = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tesseractLoadPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const timer = setTimeout(()=>reject(new Error('Zeitüberschreitung beim Laden der Texterkennung')), 15000);
    const s = document.createElement('script');
    s.src = TESSERACT_CDN;
    s.onload = () => { clearTimeout(timer); window.Tesseract ? resolve(window.Tesseract) : reject(new Error('Texterkennung nicht verfügbar')); };
    s.onerror = () => { clearTimeout(timer); reject(new Error('Texterkennung konnte nicht geladen werden (keine Internetverbindung oder durch Sandbox blockiert)')); };
    document.head.appendChild(s);
  });
  tesseractLoadPromise.catch(()=>{ tesseractLoadPromise = null; });
  return tesseractLoadPromise;
}
async function runRealScan(imageData){
  scanState = { status:'scanning', imageData, draft:null, error:null, progress:0 };
  render();
  try{
    const Tesseract = await loadTesseract();
    const { data } = await Tesseract.recognize(imageData, 'deu', {
      tessedit_pageseg_mode: '6', // "einheitlicher Textblock" statt automatischer Layout-Erkennung – zuverlässiger für schmale Kassenzettel-Spalten
      logger: m => {
        if(m.status==='recognizing text' && typeof m.progress==='number'){
          const pct = Math.round(m.progress*100);
          if(pct !== scanState.progress && scanState.status==='scanning'){ scanState.progress = pct; render(); }
        }
      }
    });
    const draft = parseReceiptText(data.text, imageData);
    if(!draft.items.length){
      scanState = { status:'error', imageData, draft:null, error:'Es konnten keine Produkte auf dem Foto erkannt werden. Achte auf gute Beleuchtung und einen vollständigen, scharfen Kassenzettel.' };
    } else {
      scanState = { status:'review', imageData, draft, error:null };
    }
  }catch(err){
    scanState = { status:'error', imageData, draft:null, error: (err && err.message) || 'Texterkennung fehlgeschlagen.' };
  }
  render();
}
const RECEIPT_NOISE = /(summe|gesamt|total|zwischensumme|zu\s*zahlen|gegeben|rückgeld|zurück|\bbar\b|ec[- ]?cash|kartenzahlung|girocard|mwst|\bust\b|steuer|\bnetto\b|\bbrutto\b|\btse\b|kassenbon|\bbeleg\b|bon-?nr|kunden-?nr|trans-?nr|vielen dank|betrag|öffnungszeiten|tel\.?:|www\.|straße|strasse|\bstr\.|geöffnet|kassierer|bediener|pfand|uhrzeit|datum)/i;
function parseReceiptText(text, imageData){
  const rawLines = String(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);

  let market = null;
  const knownMarkets = store.markets.filter(m=>m.name!=='Sonstige');
  for(const line of rawLines.slice(0,8)){
    const hit = knownMarkets.find(m => normName(line).includes(normName(m.name)));
    if(hit){ market = hit.name; break; }
  }
  if(!market) market = (knownMarkets[0] || store.markets[0]).name;

  let date = new Date().toISOString();
  const dateMatch = text.match(/\b(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})\b/);
  if(dateMatch){
    let [, d, mo, y] = dateMatch;
    if(y.length===2) y = '20'+y;
    const parsed = new Date(+y, +mo-1, +d);
    if(!isNaN(parsed)) date = parsed.toISOString();
  }

  let total = null;
  const totalLineIndex = rawLines.findIndex(l => /(summe|gesamt|total)/i.test(l) && !/zwischensumme/i.test(l));
  if(totalLineIndex >= 0){
    const nums = rawLines[totalLineIndex].match(/(\d{1,4}[.,]\d{2})/g);
    if(nums) total = parseFloat(nums[nums.length-1].replace(',','.'));
  }
  // Fallback-Cutoff: Die Zahlungsart-Zeile (Kartenzahlung/EC-Cash/...) steht auf jedem Bon
  // direkt nach der Summe. Falls OCR "Summe" selbst verstümmelt (z.B. zu "Sunne"), greift das
  // als zweite Absicherung, damit Steuer-Aufschlüsselung & Kundenbeleg danach nicht als
  // Position landen – alles ab hier ist garantiert kein Produkt mehr.
  const paymentLineIndex = rawLines.findIndex(l => /kartenzahlung|ec[- ]?cash|girocard/i.test(l));
  const cutoffCandidates = [totalLineIndex, paymentLineIndex].filter(i => i >= 0);
  const cutoffIndex = cutoffCandidates.length ? Math.min(...cutoffCandidates) : -1;
  const itemLines = cutoffIndex >= 0 ? rawLines.slice(0, cutoffIndex) : rawLines;

  const items = [];
  // Beträge, die im Bon-Total stecken, aber bewusst nicht als Position importiert werden
  // (Pfand-Zeilen zählen positiv zum Bon-Total hinzu, Rabatt/Leergut-Rückgaben negativ) –
  // wird beim Summen-Abgleich in der Review-Ansicht gegengerechnet, siehe viewScanReview().
  let excludedAdjustment = 0;
  const qtyPrefixRe = /^(\d{1,2})\s*[xX]\s*/;
  const qtyMultRe = /(\d{1,2})\s*[*xX]\s*\d{1,3}[.,]\d{2}\s*$/; // "2 * 0,79" (Menge * Einzelpreis) am Zeilenende
  // Nimmt die LETZTE Preis-Zahl einer Zeile statt eine strikte Endposition zu verlangen: echte
  // Fotos bringen oft Bildrauschen/Wasserzeichen-Reste hinter dem Preis (z.B. "2,79 B VA A" oder
  // "1.748 U 8" statt "1,74 A") – ein strikter End-Anker wirft solche Zeilen sonst komplett weg.
  function findTrailingPrice(line){
    const matches = [...line.matchAll(/(-)?(\d{1,4}[.,]\d{2})/g)];
    return matches.length ? matches[matches.length-1] : null;
  }
  for(const line of itemLines){
    if(RECEIPT_NOISE.test(line)){
      if(/pfand/i.test(line)){
        const pfandMatch = findTrailingPrice(line);
        if(pfandMatch && pfandMatch[1] !== '-') excludedAdjustment += parseFloat(pfandMatch[2].replace(',','.'));
      }
      continue;
    }
    if(/^[\d.,\s-]+$/.test(line)) continue;
    const priceMatch = findTrailingPrice(line);
    if(!priceMatch) continue;
    if(priceMatch[1] === '-'){
      excludedAdjustment -= parseFloat(priceMatch[2].replace(',','.')); // negative Beträge (Rabatt, Pfand-Rückgabe, Storno) nicht als Produkt importieren
      continue;
    }
    let name = line.slice(0, priceMatch.index).trim();
    let quantity = 1;
    const qtyPrefixMatch = name.match(qtyPrefixRe);
    if(qtyPrefixMatch){
      quantity = parseInt(qtyPrefixMatch[1],10) || 1;
      name = name.slice(qtyPrefixMatch[0].length).trim();
    } else {
      const qtyMultMatch = name.match(qtyMultRe);
      if(qtyMultMatch){
        quantity = parseInt(qtyMultMatch[1],10) || 1;
        name = name.slice(0, qtyMultMatch.index).trim();
      }
    }
    name = name.replace(/[*#]+$/,'').trim();
    if(name.length < 2 || normName(name) === normName(market)) continue;
    const price = parseFloat(priceMatch[2].replace(',','.'));
    if(!(price > 0) || price > 500) continue;
    const existing = store.products.find(p => normName(p.name) === normName(name));
    items.push({
      name,
      quantity,
      unit: existing ? existing.defaultUnit : 'Stück',
      price: Math.round(price*100)/100,
      categoryId: existing ? existing.categoryId : classifyProduct(name),
      isNew: !existing,
    });
  }

  return { market, date, total, items, imageData, excludedAdjustment: Math.round(excludedAdjustment*100)/100 };
}

function cancelScan(){ resetScan(); }
function updateDraft(field, val){ if(!scanState.draft) return; scanState.draft[field] = field==='date' ? new Date(val).toISOString() : val; }
function updateScanTotalDisplay(){
  const el = document.getElementById('scan-total'); if(!el || !scanState.draft) return;
  el.textContent = fmtEUR(scanState.draft.items.reduce((a,i)=>a+(i.price||0),0));
}
function updateDraftItem(idx, field, val){
  const it = scanState.draft.items[idx]; if(!it) return;
  if(field==='quantity') it.quantity = parseFloat(val)||0;
  else if(field==='price') it.price = parseFloat(val)||0;
  else if(field==='categoryId'){ it.categoryId = val; rememberCorrection(it.name, val); }
  else it[field] = val;
  updateScanTotalDisplay();
}

function removeDraftItem(idx){ scanState.draft.items.splice(idx,1); render(); }
function confirmScan(){
  const d = scanState.draft;
  if(!d.items.length){ toast('Bitte mindestens ein Produkt hinzufügen.', true); return; }
  if(!d.market){ toast('Bitte einen Markt wählen.', true); return; }
  const items = d.items.map(it=>{
    if(!it.name || !it.name.trim()) it.name = 'Produkt';
    const prod = findOrCreateProduct(it.name, it.categoryId, it.unit, it.price);
    return { id:uid(), productId:prod.id, name:it.name, quantity:it.quantity||1, unit:it.unit||'Stück', price:it.price||0, categoryId:it.categoryId };
  });
  const total = Math.round(items.reduce((a,i)=>a+i.price,0)*100)/100;
  const shopping = { id:uid(), market:d.market, date:d.date, total, receiptImage:d.imageData||null, items,
    source: d.imageData?'scan':'manual', isDemo:false, createdAt:nowIso() };
  store.shoppings.unshift(shopping);
  items.forEach(it=>{
    const prod = prodById(it.productId);
    prod.purchaseCount++; prod.lastPurchasedAt = shopping.date; prod.defaultPrice = it.price; prod.updatedAt = nowIso();
    if(prod.categoryId !== it.categoryId) prod.categoryId = it.categoryId;
    store.priceHistory.push({ id:uid(), productId:prod.id, shoppingId:shopping.id, price:it.price, date:shopping.date, market:d.market });
  });
  saveStore(); scanState = {status:'idle', imageData:null, draft:null, error:null};
  toast('Einkauf gespeichert · '+fmtEUR(total));
  nav('verlauf/'+shopping.id);
}

  const mime = filename.endsWith('.json') ? 'application/json'
    : filename.endsWith('.csv') ? 'text/csv;charset=utf-8'
    : 'text/plain;charset=utf-8';
  const blob = new Blob([data], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
async function offerDownload(filename, data, isCsv){
  const inClaudeViewer = !!(window.claude && window.claude.use);
  if(!inClaudeViewer){
    /* Plain browser (e.g. GitHub Pages, file://) — no Claude runtime involved at all. */
    try{ nativeDownload(filename, data); toast('Datei heruntergeladen'); }
    catch(e){ toast('Download fehlgeschlagen.', true); }
    return;
  }
  /* Inside the Claude Artifact viewer, a plain <a download> link is inert —
     must go through the downloads capability instead. */
  try{
    const downloads = await window.claude.use('downloads');
    if(!downloads){ toast('Download ist in dieser Ansicht nicht verfügbar.', true); return; }
    await downloads.save({filename, data});
    toast('Datei gespeichert');
  }catch(e){
    const code = e && e.code;
    if(code==='extension_not_enabled' && isCsv){
      try{
        const downloads = await window.claude.use('downloads');
        await downloads.save({filename: filename.replace(/\.csv$/,'.txt'), data});
        toast('Als .txt gespeichert (CSV-Export ist hier nicht aktiviert)');
        return;
      }catch(e2){ /* fall through to generic error */ }
    }
    if(code==='declined') return;
    toast('Download fehlgeschlagen.', true);
  }
}
async function exportJson(){
  await offerDownload(`wochenkorb-export-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(store, null, 2));
}
async function exportCsv(){
  const rows = [['Datum','Markt','Produkt','Menge','Einheit','Preis','Produktgruppe']];
  store.shoppings.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).forEach(s=>{
    s.items.forEach(i=>{ rows.push([fmtDate(s.date), s.market, i.name, i.quantity, i.unit, i.price.toFixed(2).replace('.',','), catById(i.categoryId)?catById(i.categoryId).name:'']); });
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  await offerDownload(`wochenkorb-historie-${new Date().toISOString().slice(0,10)}.csv`, csv, true);
}
function importJson(ev){
  const file = ev.target.files && ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onerror = () => toast('Datei konnte nicht gelesen werden.', true);
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.products) || !Array.isArray(data.shoppings) || !Array.isArray(data.categories)){
        toast('Ungültige Datei – kein gültiger Wochenkorb-Export.', true); return;
      }
      confirmDialog('Daten importieren', 'Vorhandene Daten werden durch die Importdatei ersetzt. Fortfahren?', ()=>{
        store = data; seedDefaults(store);
        if(!store.settings) store.settings = { theme:'system', firstRunDone:true, demoActive:false, recurringTemplate:[] };
        if(!store.categoryCorrections) store.categoryCorrections = {};
        if(!Array.isArray(store.priceHistory)) store.priceHistory = [];
        saveStore(); applyTheme(); closeModal(); nav(''); toast('Daten importiert');
      });
    }catch(e){ toast('Datei konnte nicht gelesen werden – ungültiges JSON.', true); }
  };
  reader.readAsText(file);
}
